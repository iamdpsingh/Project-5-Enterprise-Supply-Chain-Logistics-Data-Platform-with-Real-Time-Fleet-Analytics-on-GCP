name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: supply-chain-logistics-508517
  REGION: us-central1

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint
        run: flake8 --max-line-length 120 --exclude .venv

      - name: Run tests
        run: pytest tests/ -v

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fleet-simulator ./fleet_simulator

  deploy:
    runs-on: ubuntu-latest
    needs: [lint-and-test, terraform-validate, docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Fleet Simulator
        run: |
          gcloud builds submit \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/fleet-simulator/simulator:latest \
            ./fleet_simulator
          gcloud run deploy fleet-simulator \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/fleet-simulator/simulator:latest \
            --region ${{ env.REGION }} \
            --platform managed
