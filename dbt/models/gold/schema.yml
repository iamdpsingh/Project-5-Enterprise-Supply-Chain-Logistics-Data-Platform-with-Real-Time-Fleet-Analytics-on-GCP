version: 2

models:
  - name: fact_orders
    description: "Order fact table enriched with customer info and item counts."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

  - name: fact_shipments
    description: "Shipment fact table with vehicle, driver, warehouse, and delay info."
    columns:
      - name: shipment_id
        tests:
          - unique
          - not_null
      - name: vehicle_id
        tests:
          - not_null
          - relationships:
              to: source('silver', 'vehicles')
              field: vehicle_id

  - name: fact_fleet_telemetry
    description: "Incremental fleet telemetry with speed and engine health flags."
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: speed_kmh
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 200
